<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Fetcherr · Logs</title>
  <link rel="icon" type="image/svg+xml" href="/ui/static/fetcherr.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/static/app.css">
</head>
<body class="app-shell-page logs-page">
<div class="shell">

  <nav class="topbar">
    <a href="/ui/dashboard" class="brand">
      <div class="brand-icon">
        <img src="/ui/static/fetcherr.svg" alt="Fetcherr">
      </div>
      <div>
        <div class="brand-name">Fetcherr</div>
        <div class="brand-version" title="__APP_VERSION_TITLE__">__APP_VERSION_LABEL__</div>
      </div>
    </a>
    <div class="topbar-right">
      <a class="topbar-nav-link" href="/ui/settings" title="Settings">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="topbar-nav-label">Settings</span>
      </a>
      <a class="topbar-nav-link" href="/ui/dashboard" title="Library">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="topbar-nav-label">Library</span>
      </a>
      <button class="icon-btn" id="logoutBtn" title="Sign out" style="display:none" onclick="doLogout()">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </div>
  </nav>

  <div class="page-header">
    <div>
      <h1 class="page-title">Logs</h1>
      <p class="page-sub">Recent application activity. Shows the newest 1000 entries.</p>
    </div>
  </div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" id="tabAll"   onclick="setLevel('all')">All</button>
      <button class="tab info"   id="tabInfo"  onclick="setLevel('info')">Info</button>
      <button class="tab warn"   id="tabWarn"  onclick="setLevel('warn')">Warnings</button>
      <button class="tab error"  id="tabError" onclick="setLevel('error')">Errors</button>
    </div>
    <div class="refresh-status">
      <span class="refresh-dot" id="refreshDot"></span>
      <span>Auto-refreshing every 5s</span>
    </div>
  </div>

  <section class="section log-metrics-section">
    <div class="section-title">Add-on Provider Health</div>
    <div class="provider-metrics" id="providerMetrics"></div>
  </section>

  <div class="log-list" id="logList"></div>
</div>

<script>
  let activeLevel = 'all'

  function setLevel(level) {
    activeLevel = level
    ;['all','info','warn','error'].forEach(l => {
      const tab = document.getElementById('tab' + l.charAt(0).toUpperCase() + l.slice(1))
      if (tab) tab.classList.toggle('active', l === level)
    })
    loadLogs()
  }

  function esc(v) {
    return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  }

  function formatTime(iso) {
    const d = new Date(iso)
    if (isNaN(d)) return iso
    return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      + ' ' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
  }

  async function loadLogs() {
    const res = await fetch(`/ui/logs-data?level=${activeLevel}`)
    if (res.status === 401) { window.location.href = '/ui/login'; return }
    if (!res.ok) return
    const d = await res.json()
    const entries = d.entries || []
    const metrics = d.providerMetrics || []

    const dot = document.getElementById('refreshDot')
    dot.classList.add('flash')
    setTimeout(() => dot.classList.remove('flash'), 400)

    const list = document.getElementById('logList')
    renderProviderMetrics(metrics)
    if (!entries.length) {
      list.innerHTML = '<div class="empty">No log entries yet.</div>'
      return
    }

    list.innerHTML = entries.map(e => `
      <div class="log-entry ${esc(e.level)}">
        <span class="log-time">${esc(formatTime(e.time))}</span>
        <span class="log-badge ${esc(e.level)}">${esc(e.level)}</span>
        <span class="log-msg">${esc(e.msg)}</span>
      </div>`).join('')

  }

  function renderProviderMetrics(metrics) {
    const wrap = document.getElementById('providerMetrics')
    if (!metrics.length) {
      wrap.innerHTML = '<div class="empty compact">No add-on calls recorded yet.</div>'
      return
    }

    const byProvider = new Map()
    for (const metric of metrics) {
      const key = metric.provider || 'Unknown provider'
      const current = byProvider.get(key) || { provider: key, calls: 0, failures: 0, totalMs: 0, streams: 0, last: metric }
      current.calls += 1
      current.failures += metric.ok ? 0 : 1
      current.totalMs += Number(metric.durationMs || 0)
      current.streams += Number(metric.streams || 0)
      if (new Date(metric.time) > new Date(current.last.time)) current.last = metric
      byProvider.set(key, current)
    }

    const rows = [...byProvider.values()].slice(0, 12).map(row => {
      const avgMs = row.calls ? Math.round(row.totalMs / row.calls) : 0
      const failureRate = row.calls ? Math.round((row.failures / row.calls) * 100) : 0
      const last = row.last || {}
      const status = last.ok ? 'ok' : 'error'
      return `
        <div class="provider-metric ${status}">
          <div class="provider-metric-main">
            <div class="provider-metric-name">${esc(row.provider)}</div>
            <div class="provider-metric-path">${esc(last.path || '')}</div>
          </div>
          <div class="provider-metric-stat">
            <span>avg</span>
            <strong>${esc(avgMs)}ms</strong>
          </div>
          <div class="provider-metric-stat">
            <span>fail</span>
            <strong>${esc(failureRate)}%</strong>
          </div>
          <div class="provider-metric-stat">
            <span>last</span>
            <strong>${esc(last.streams ?? 0)}</strong>
          </div>
        </div>`
    }).join('')
    wrap.innerHTML = rows
  }

  async function doLogout() {
    await fetch('/ui/auth/logout', { method: 'POST' })
    window.location.href = '/ui/login'
  }

  async function checkAuth() {
    const res = await fetch('/ui/auth/check')
    if (res.ok) {
      const d = await res.json()
      if (d.authEnabled) document.getElementById('logoutBtn').style.display = ''
    }
  }

  checkAuth()
  loadLogs()
  setInterval(loadLogs, 5000)
</script>
